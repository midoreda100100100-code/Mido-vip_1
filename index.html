<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الميزانية والتوفير الذكي - Mido VIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        
        body { 
            margin: 0; padding: 20px 10px; min-height: 100vh; 
            background: #090d16; color: #fff; 
            display: flex; justify-content: center; align-items: center;
        }

        /* كارت الميزانية مع إضاءة خ خلفية نيون */
        .container { 
            width: 100%; max-width: 450px; 
            background: #131b2e; padding: 25px; border-radius: 20px; 
            border: 1px solid rgba(56, 189, 248, 0.2); 
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.15), 0 10px 30px rgba(0,0,0,0.5); 
        }

        h1 { 
            color: #38bdf8; font-size: 22px; text-align: center; margin-bottom: 20px; font-weight: 800;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .ad-box { 
            background: #090d16; border: 1px dashed #38bdf8; color: #94a3b8; 
            text-align: center; padding: 12px; margin: 15px 0; border-radius: 10px; font-size: 13px; 
        }

        .input-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 6px; color: #94a3b8; font-size: 14px; }
        
        input { 
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #1e293b; 
            background: #090d16; color: #fff; font-size: 15px; outline: none;
            transition: 0.3s ease;
        }

        input:focus { 
            border-color: #38bdf8; 
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        /* زرار منور ومتوهج */
        button { 
            width: 100%; padding: 14px; border-radius: 10px; border: none; 
            background: linear-gradient(135deg, #38bdf8, #2563eb); color: #fff; 
            font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 10px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            transition: 0.2s ease;
        }

        button:active { transform: scale(0.98); }

        .results { 
            display: none; margin-top: 20px; background: #090d16; padding: 18px; 
            border-radius: 12px; border: 1px solid #38bdf8; 
            box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.1);
        }

        .res-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 15px; }
        .val { color: #4ade80; font-weight: bold; text-shadow: 0 0 8px rgba(74, 222, 128, 0.3); }
        .val-warn { color: #f43f5e; font-weight: bold; text-shadow: 0 0 8px rgba(244, 63, 94, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 حاسبة الميزانية والتوفير</h1>
        
        <div class="ad-box">📢 مساحة إعلانية (Google AdSense)</div>

        <div class="input-group">
            <label>الدخل الشهري أو المصروف:</label>
            <input type="number" id="income" placeholder="مثال: 5000">
        </div>
        <div class="input-group">
            <label>المصاريف الثابتة (فواتير، إيجار، إلخ):</label>
            <input type="number" id="expenses" placeholder="مثال: 2000">
        </div>

        <button onclick="calcBudget()">حساب خطة التوفير</button>

        <div class="ad-box">📢 مساحة إعلانية وسطى</div>

        <div id="results" class="results">
            <div class="res-item"><span>🏠 الأساسيات والالتزامات:</span><span id="expVal" class="val"></span></div>
            <div class="res-item"><span>🛒 مصاريف متغيرة وترفيه:</span><span id="flexVal" class="val"></span></div>
            <div class="res-item"><span>💎 المبلغ المفترض توفيره شهرياً:</span><span id="saveVal" class="val"></span></div>
            <div class="res-item"><span>🚀 التوفير المتوقع في السنة:</span><span id="yearVal" class="val"></span></div>
        </div>
    </div>

    <script>
        function calcBudget() {
            let inc = parseFloat(document.getElementById('income').value);
            let exp = parseFloat(document.getElementById('expenses').value) || 0;

            if(inc > 0) {
                let save = Math.round(inc * 0.20);
                let flex = inc - exp - save;

                document.getElementById('expVal').innerText = exp + ' ج.م';
                document.getElementById('saveVal').innerText = save + ' ج.م';
                document.getElementById('yearVal').innerText = (save * 12) + ' ج.م';

                let flexElem = document.getElementById('flexVal');
                if(flex >= 0) {
                    flexElem.innerText = flex + ' ج.م';
                    flexElem.className = 'val';
                } else {
                    flexElem.innerText = 'عجز بـ ' + Math.abs(flex) + ' ج.م';
                    flexElem.className = 'val-warn';
                }

                document.getElementById('results').style.display = 'block';
            }
        }
    </script>
</body>
</html>
