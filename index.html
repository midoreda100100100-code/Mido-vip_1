<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أداة حساب السعرات الحرارية</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; background: #f0f2f5; }
        .card { background: white; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { padding: 12px; margin: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; }
        button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        #result { margin-top: 20px; font-size: 18px; color: #333; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>أداة حساب السعرات التقديرية</h2>
        <input type="number" id="weight" placeholder="الوزن بالكجم">
        <br>
        <button onclick="calc()">احسب الآن</button>
        <div id="result"></div>
    </div>

    <script>
        function calc() {
            let w = document.getElementById('weight').value;
            if(w) {
                let calories = Math.round(w * 24 * 1.2);
                document.getElementById('result').innerText = 'احتياجك اليومي التقريبي: ' + calories + ' سعرة حرارية';
            }
        }
    </script>
</body>
</html>
